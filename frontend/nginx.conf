server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Exact match for /config
    location = /config {
        proxy_pass         http://backend:8000/config;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Prefix match for /config/ sub-routes (e.g. /config/theme)
    location /config/ {
        proxy_pass         http://backend:8000/config/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # prefix routes - sub-paths (e.g. /metrics/WTI_USD) pass through unchanged
    location /metrics/ {
        proxy_pass         http://backend:8000/metrics/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /prices/ {
        proxy_pass         http://backend:8000/prices/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /settings/ {
        proxy_pass         http://backend:8000/settings/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /commodities/ {
        proxy_pass         http://backend:8000/commodities/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /proxy/ {
        proxy_pass         http://proxy:8002/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Allow large pages
        proxy_buffer_size       128k;
        proxy_buffers           8 256k;
        proxy_busy_buffers_size 256k;
    }

    location = /last_refresh {
        proxy_pass         http://backend:8000/last_refresh;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # spa fallback - hand index.html to anything that didn't match above
    location / {
        try_files $uri $uri/ /index.html;
    }
}
